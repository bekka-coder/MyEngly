<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MyEngly</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1226;--card:#1b1f3b;--card2:#272c56;--text:#f1f3ff;--muted:#9aa0c8;--accent:#6c8cff;--gold:#ffb84d;--good:#3ddc97;--bad:#ff5d73;--fs:18px}
body.t-light{--bg:#f3f5ff;--card:#ffffff;--card2:#e4e9ff;--text:#1c2040;--muted:#6b7199;--accent:#4a63f0;--gold:#d98200}
body.t-ocean{--bg:#06232b;--card:#0b3a47;--card2:#115063;--text:#e6fbff;--muted:#8cc3cf;--accent:#27c9b8;--gold:#ffd166}
body.t-sunset{--bg:#2a1020;--card:#431a33;--card2:#5c2544;--text:#fff1ea;--muted:#d9a5b8;--accent:#ff7a59;--gold:#ffcf5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:12px 12px 20px;min-height:100vh;display:flex;flex-direction:column}
#hdr{display:flex;gap:8px;justify-content:space-between;margin-bottom:10px}
.chip{background:var(--card);padding:6px 12px;border-radius:20px;font-size:.8em;font-weight:700;flex:1;text-align:center}
#screen{flex:1}
h2{margin:6px 0 10px;font-size:1.25em}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.muted{color:var(--muted);font-size:.8em}
.btn{background:var(--card2);color:var(--text);border:0;border-radius:12px;padding:12px 14px;font-size:.9em;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:#fff}
.btn.gold{background:var(--gold);color:#222}
.btn.good{background:var(--good);color:#082}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.btn.back{width:auto;padding:8px 14px;margin-bottom:6px}
.row{display:flex;gap:8px;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.game{display:flex;gap:12px;align-items:center;cursor:pointer}
.game .ico{font-size:1.8em}
.game.lock{opacity:.45}
input[type=text]{width:100%;padding:13px;border-radius:12px;border:2px solid var(--card2);background:var(--card);color:var(--text);font-size:1em;font-family:inherit;outline:none}
input[type=text]:focus{border-color:var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.big{font-size:1.6em}
.timebar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-bottom:8px}
.timebar i{display:block;height:100%;background:var(--accent);width:100%}
.arena{position:relative;height:200px;background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden}
.gword{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.9em;font-weight:800;text-align:center;width:90%}
.gword.mir{transform:translate(-50%,-50%) scaleX(-1)}
.gword.hid{transform:none;width:auto;font-size:.85em;opacity:.3}
.bat{position:absolute;font-size:1.8em;animation:fly 3s linear infinite;pointer-events:none;z-index:5}
@keyframes fly{from{left:-15%}to{left:110%}}
.okf{background:rgba(61,220,151,.3)!important}
.badf{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.opts .btn{padding:14px 8px}
.progress{height:10px;background:var(--card2);border-radius:8px;overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--good)}
.fact{border-left:4px solid var(--gold)}
.dots{letter-spacing:2px;color:var(--gold);font-size:.8em}
.wl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--card2)}
.tw{cursor:pointer;border-radius:4px;padding:0 1px}
.tw.mark{background:var(--gold);color:#222}
.read{line-height:1.7;font-size:1em}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:.8em;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.show{display:flex}
.mbox{background:var(--card);border-radius:18px;padding:20px;max-width:380px;width:100%;text-align:center}
.mbox .btn{margin-top:14px}
footer{margin-top:18px;text-align:center;color:var(--muted);font-size:.65em;line-height:1.6}
.wg{display:grid;gap:5px;margin:8px auto;max-width:280px}
.wr{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.wt{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--card2);border-radius:8px;font-weight:800;text-transform:uppercase;font-size:1.1em}
.wt.g,.wk.g{background:#3a9d5d;border-color:#3a9d5d;color:#fff}
.wt.y,.wk.y{background:#c9a227;border-color:#c9a227;color:#fff}
.wt.b,.wk.b{background:#4a4f6e;border-color:#4a4f6e;color:#fff}
.kb{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.kr{display:flex;gap:4px;justify-content:center}
.wk{flex:1;max-width:36px;padding:12px 0;border:0;border-radius:6px;background:var(--card2);color:var(--text);font-weight:700;text-transform:uppercase;font-size:.75em;cursor:pointer}
.wk.wide{max-width:56px}
input[type=range]{width:100%}
</style>
</head>
<body>
<div id="app">
  <div id="hdr"></div>
  <div id="screen"></div>
  <footer id="foot"></footer>
</div>
<div id="toast"></div>
<div id="modal"></div>

<script>
/* ============ НАСТРОЙКИ (меняй под себя) ============ */
const CONFIG = {
  LEVEL_BASE: 100,      // цена 1 уровня
  LEVEL_MULT: 2.5,      // множитель цены каждого следующего уровня
  REWARD_GROWTH: 0.5,   // рост награды за уровень: награда × (1 + уровень × 0.5). Поставь 0, чтобы отключить
  COIN_PER_WORD: 3,     // койнов за слово в «Угадай слово»
  REVIEW_BONUS: 5,      // бонус за прохождение повторения
  BUFF_LIMIT: 2,        // сколько раз можно использовать каждый бафф за игру
  DEV: "BekaBratan",
  SPONSORS: "Durex, Nestle, PepsiCola, Kamaz", // это просто текст; для реального запуска нужны договорённости со спонсорами
  BOT_LINK: "https://t.me/MyEnglyBot"          // замени на ссылку своего бота / мини-аппа
};

/* ============ СЛОВА ============
   Формат: "english:перевод/другой перевод;next:..."
   Сейчас по ~12 слов на уровень. Дополни каждый уровень до 100 слов. */
const RAW = [
 {t:"Старт", w:"hello:привет;yes:да;no:нет;thanks:спасибо;please:пожалуйста;water:вода;bread:хлеб;house:дом;cat:кошка/кот;dog:собака;mother:мама/мать;father:папа/отец;book:книга;sun:солнце;red:красный;big:большой;good:хороший;day:день;night:ночь;friend:друг"},
 {t:"Семья и дом", w:"family:семья;brother:брат;sister:сестра;kitchen:кухня;window:окно;door:дверь;table:стол;chair:стул;bed:кровать;garden:сад;roof:крыша;wall:стена"},
 {t:"Еда", w:"apple:яблоко;cheese:сыр;chicken:курица;soup:суп;sugar:сахар;butter:масло;breakfast:завтрак;dinner:ужин;vegetable:овощ;fruit:фрукт;potato:картофель/картошка;milk:молоко"},
 {t:"Город и транспорт", w:"street:улица;bridge:мост;station:вокзал/станция;ticket:билет;airport:аэропорт;train:поезд;bus:автобус;road:дорога;map:карта;tourist:турист;luggage:багаж;passport:паспорт"},
 {t:"Природа", w:"forest:лес;river:река;mountain:гора;island:остров;ocean:океан;valley:долина;storm:буря/шторм;cloud:облако;rainbow:радуга;desert:пустыня;lake:озеро;thunder:гром"},
 {t:"Работа и учёба", w:"salary:зарплата;manager:менеджер/начальник;meeting:встреча/собрание;deadline:срок/дедлайн;lesson:урок;exam:экзамен;homework:домашнее задание;teacher:учитель;student:студент;career:карьера;office:офис;skill:навык"},
 {t:"Тело и здоровье", w:"shoulder:плечо;elbow:локоть;stomach:живот/желудок;throat:горло;fever:температура/лихорадка;medicine:лекарство;injury:травма;headache:головная боль;dentist:стоматолог;allergy:аллергия;recovery:выздоровление;symptom:симптом"},
 {t:"Технологии", w:"software:программа/по;network:сеть;password:пароль;screen:экран;battery:батарея/аккумулятор;device:устройство;browser:браузер;download:скачивать/загрузка;keyboard:клавиатура;algorithm:алгоритм;database:база данных;update:обновление"},
 {t:"Общество", w:"government:правительство;citizen:гражданин;election:выборы;law:закон;justice:справедливость/правосудие;freedom:свобода;society:общество;economy:экономика;tax:налог;border:граница;debate:дебаты/спор;treaty:договор"},
 {t:"Чувства и абстракции", w:"ambiguity:неоднозначность;reluctant:неохотный;genuine:настоящий/подлинный;envy:зависть;resilience:стойкость/устойчивость;nostalgia:ностальгия;ambition:амбиция/честолюбие;hesitate:колебаться;gratitude:благодарность;loneliness:одиночество;ruthless:безжалостный;vulnerable:уязвимый"},
 {t:"Продвинутый", w:"ubiquitous:вездесущий;ephemeral:мимолетный/эфемерный;meticulous:дотошный/тщательный;serendipity:счастливая случайность;scrutinize:тщательно изучать;ostensibly:якобы/на первый взгляд;perpetuate:увековечивать;juxtapose:сопоставлять;equivocal:двусмысленный;cumbersome:громоздкий;ameliorate:улучшать;obsolete:устаревший"}
];
const WORDS = [];
RAW.forEach((L,i)=>L.w.split(';').forEach(p=>{const [en,ru]=p.split(':');WORDS.push({en:en.trim(),ru:ru.split('/').map(s=>s.trim()),lvl:i})}));
const BY = {}; WORDS.forEach(w=>BY[w.en]=w);

const FACTS = [
 {en:"Honey never spoils. Archaeologists have found edible honey in ancient Egyptian tombs.",ru:"Мёд никогда не портится. Археологи находили съедобный мёд в гробницах Древнего Египта."},
 {en:"Octopuses have three hearts.",ru:"У осьминогов три сердца."},
 {en:"Bananas are berries, but strawberries are not.",ru:"Бананы — ягоды, а клубника — нет."},
 {en:"A day on Venus is longer than a year on Venus.",ru:"Сутки на Венере длиннее её года."},
 {en:"The Eiffel Tower can grow taller in summer because of the heat.",ru:"Эйфелева башня летом становится выше из-за жары."},
 {en:"Sharks existed before trees did.",ru:"Акулы появились раньше деревьев."},
 {en:"Butterflies taste with their feet.",ru:"Бабочки чувствуют вкус ногами."},
 {en:"A group of flamingos is called a flamboyance.",ru:"Группа фламинго по-английски называется «flamboyance»."},
 {en:"The most common letter in English is E.",ru:"Самая частая буква в английском — E."},
 {en:"Wombat poop is shaped like a cube.",ru:"Помёт вомбата имеет форму кубика."}
];
const TEXTS = [
 {t:"A Morning Routine",s:"Tom wakes up at six every morning. He drinks a glass of water and goes for a run in the park. After that he has breakfast with his sister. They usually eat eggs and bread. Then Tom takes the bus to his office, where he works as a designer.",
  g:{wakes:"просыпается",drinks:"пьёт",glass:"стакан",run:"бег",park:"парк",breakfast:"завтрак",usually:"обычно",eggs:"яйца",bread:"хлеб",bus:"автобус",office:"офис",works:"работает",designer:"дизайнер"},
  q:[{q:"What does Tom drink first?",o:["Tea","Water","Juice"],a:1},{q:"How does Tom get to work?",o:["By bus","By car","On foot"],a:0},{q:"What is Tom's job?",o:["Teacher","Doctor","Designer"],a:2}]},
 {t:"A Trip to the Island",s:"Last summer Anna travelled to a small island with her friends. The weather was warm and the sea was clear. Every day they swam in the morning and explored the forest in the afternoon. In the evening they cooked fish on the beach. Anna says it was the best holiday of her life.",
  g:{travelled:"путешествовала",island:"остров",weather:"погода",clear:"чистый",swam:"плавали",explored:"исследовали",forest:"лес",afternoon:"вторая половина дня",cooked:"готовили",fish:"рыба",beach:"пляж",holiday:"отпуск"},
  q:[{q:"When did Anna travel?",o:["Last winter","Last summer","Last spring"],a:1},{q:"What did they do in the morning?",o:["Swam","Slept","Cooked"],a:0},{q:"Where did they cook fish?",o:["In the forest","At home","On the beach"],a:2}]},
 {t:"The Library",s:"The city library opens at nine o'clock and closes at eight. It has more than fifty thousand books and a quiet room for students. Visitors can borrow three books for two weeks. If a book is late, they must pay a small fine.",
  g:{library:"библиотека",opens:"открывается",closes:"закрывается",quiet:"тихий",students:"студенты",visitors:"посетители",borrow:"брать на время",weeks:"недели",late:"просроченный",pay:"платить",fine:"штраф"},
  q:[{q:"When does the library close?",o:["At six","At eight","At nine"],a:1},{q:"How many books can visitors borrow?",o:["Two","Five","Three"],a:2},{q:"What happens if a book is late?",o:["A fine","Nothing","A free book"],a:0}]}
];
const WL = [["apple","яблоко"],["house","дом"],["water","вода"],["bread","хлеб"],["light","свет"],["table","стол"],["green","зелёный"],["music","музыка"],["happy","счастливый"],["smile","улыбка"],["world","мир"],["dream","мечта"],["night","ночь"],["plant","растение"],["river","река"],["money","деньги"],["story","история"],["heart","сердце"],["chair","стул"],["phone","телефон"],["beach","пляж"],["cloud","облако"],["train","поезд"],["sleep","сон"],["black","чёрный"],["white","белый"],["learn","учить"],["speak","говорить"],["early","рано"],["brave","смелый"]];

const MODES = {
 easiest:{n:"Легчайший",sec:45,rw:.5,opts:1},
 easy:{n:"Простой",sec:40,rw:.8},
 mid:{n:"Средняк",sec:30,rw:1},
 hard:{n:"Сложно",sec:25,rw:1.5,rev:.2},
 awful:{n:"Ужасный",sec:20,rw:2,rev:.3,mirror:.3,scr:.3},
 imp:{n:"Невозможный",sec:20,rw:3.5,rev:.3,mirror:.4,scr:.4,fake:1,swap:1,sticky:1,bats:1,hide:.25}
};
const SHOP = [
 {id:"x2",ico:"✖2",n:"Множитель ×2",d:"Удваивает койны за одну игру «Угадай слово»",p:60},
 {id:"auto",ico:"🤖",n:"Авто-ответ",d:"Сам отвечает на текущее слово",p:40},
 {id:"freeze",ico:"❄️",n:"Заморозка времени",d:"Останавливает таймер на 10 секунд",p:50},
 {id:"opts",ico:"🔢",n:"Варианты ответа",d:"Показывает 4 варианта перевода",p:30}
];
const UNLOCKS = {2:"Лишнее слово",5:"Смотри!",8:"Чтение",10:"Режимы сложности"};
const DAY = 86400000, DAYS = [0,1,3,7,14,30];

/* ============ УТИЛИТЫ ============ */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const norm = s => String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9 ]/g,'').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function ok(inp,answers){const x=norm(inp);if(!x)return false;return answers.some(a=>{a=norm(a);return a===x||(a.length>=5&&lev(a,x)<=1)})}
function dstr(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
const lvCost = n => Math.round(CONFIG.LEVEL_BASE*Math.pow(CONFIG.LEVEL_MULT,n-1));
const mult = () => 1+S.level*CONFIG.REWARD_GROWTH;
const tg = window.Telegram && Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
function hap(t){if(!S.vib||!tg||!tg.HapticFeedback)return;try{if(t==='ok')tg.HapticFeedback.notificationOccurred('success');else if(t==='bad')tg.HapticFeedback.notificationOccurred('error');else tg.HapticFeedback.impactOccurred('light')}catch(e){}}

/* ============ СОСТОЯНИЕ ============ */
const KEY="myengly_v1";
const def = () => ({coins:0,level:0,lib:{},streak:0,last:"",tested:false,buffs:{x2:0,auto:0,freeze:0,opts:0},theme:"dark",fs:18,vib:true,wd:{date:"",g:[],done:false,won:false},best:0,factIdx:0,games:0});
let S = def();
try{const r=JSON.parse(localStorage.getItem(KEY));if(r)S=Object.assign(def(),r)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function applyTheme(){document.body.className='t-'+S.theme;document.documentElement.style.setProperty('--fs',S.fs+'px')}
function addWord(en,ru,k=1){if(!S.lib[en])S.lib[en]={ru:ru,k:k,next:Date.now()+DAYS[k]*DAY,wr:0,ts:Date.now()}}
function grade(en,right){const e=S.lib[en];if(!e)return;if(right){e.k=Math.min(5,e.k+1);e.next=Date.now()+DAYS[e.k]*DAY}else{e.k=Math.max(0,e.k-2);e.wr++;e.next=Date.now()}}
const learned = () => Object.values(S.lib).filter(e=>e.k>=5).length;

/* ============ UI-ПОМОЩНИКИ ============ */
let CL=[], SC='menu';
function clean(){CL.forEach(f=>{try{f()}catch(e){}});CL=[]}
function view(h){$('#screen').innerHTML=h;window.scrollTo(0,0)}
function head(){$('#hdr').innerHTML=`<div class="chip">🪙 ${S.coins}</div><div class="chip">⭐ ур. ${S.level}</div><div class="chip">🔥 ${S.streak} дн.</div>`}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1900)}
function modal(h,btn,cb){$('#modal').innerHTML=`<div class="mbox">${h}<button class="btn pri" id="mok">${btn||'OK'}</button></div>`;$('#modal').classList.add('show');$('#mok').onclick=()=>{$('#modal').classList.remove('show');cb&&cb()}}
const backBtn = `<button class="btn back" onclick="menu()">← Меню</button>`;
const dots = k => '●'.repeat(k)+'○'.repeat(5-k);

/* ============ МЕНЮ ============ */
function menu(){
  clean();SC='menu';head();
  const f=FACTS[S.factIdx%FACTS.length];
  const games=[
   ['⚡','Угадай слово','Переведи как можно больше за 30 сек',0,'guessIntro()'],
   ['🔁','Повторение','Закрепи выученные слова',0,'startReview(false)'],
   ['🟩','Wordle','Английское слово дня',0,'wordle()'],
   ['🧩','Лишнее слово','Найди слово не по теме',2,'startOdd()'],
   ['👀','Смотри!','Лови правильный перевод',5,'startWatch()'],
   ['📖','Чтение','Текст, вопросы, новые слова',8,'startRead()']
  ];
  const pct=Math.min(100,learned()/10);
  view(`
  <div class="card fact"><div class="muted">💡 Fact of the day</div>
    <div style="margin:6px 0">${f.en}</div>
    <div class="muted" id="fru" style="display:none">${f.ru}</div>
    <button class="btn" style="margin-top:6px;padding:6px" onclick="document.getElementById('fru').style.display='block';this.remove()">Перевод</button></div>
  <div class="card"><div class="muted">Выучено слов: ${learned()} / 1000</div><div class="progress"><i style="width:${pct}%"></i></div></div>
  ${games.map(g=>{const open=S.level>=g[3];return `<div class="card game ${open?'':'lock'}" onclick="${open?g[4]:`toast('Откроется на ${g[3]} уровне')`}"><div class="ico">${open?g[0]:'🔒'}</div><div><b>${g[1]}</b><div class="muted">${open?g[2]:'с '+g[3]+' уровня'}</div></div></div>`}).join('')}

let selMode='mid',useX2=false,G=null;
function guessIntro(){

  <div class="card"><label><input type="checkbox" ${S.buffs.x2>0?'':'disabled'} ${useX2?'checked':''} onchange="useX2=this.checked"> Включить множитель ×2 (в запасе: ${S.buffs.x2})</label>
  <div class="muted" style="margin-top:6px">Авто-ответ: ${S.buffs.auto} · Заморозка: ${S.buffs.freeze} · Варианты: ${S.buffs.opts}</div></div>
  <button class="btn pri" onclick="startGuess()">Начать</button>`);
}
function startGuess(){
  clean();SC='guess';
  const M=MODES[selMode];
  G={M:M,t:M.sec,tot:M.sec,score:0,used:{auto:0,freeze:0,opts:0},x2:false,frozen:0,off:0,k:0,idx:0,over:false,got:[],pool:shuffle(WORDS.filter(w=>w.lvl<=S.level))};
  if(useX2&&S.buffs.x2>0){S.buffs.x2--;G.x2=true;save()}
  useX2=false;
  view(`<div class="bar"><div class="big" id="gt">${M.sec}</div><div id="gs">Счёт: 0 ${G.x2?'· ×2':''}</div></div>
  <div class="timebar"><i id="tb"></i></div>
  <div class="arena" id="ar"><div id="gw" class="gword"></div></div>
  <div id="gopts"></div>
  <input type="text" id="gi" placeholder="Перевод..." autocomplete="off" autocapitalize="off">
  <div class="row"><button class="btn" onclick="gNext()">Пропустить ⏭</button><button class="btn pri" onclick="gSubmit()">Ответить ✔</button></div>
  <div class="row"><button class="btn" onclick="gBuff('auto')">🤖 ${S.buffs.auto}</button><button class="btn" onclick="gBuff('freeze')">❄️ ${S.buffs.freeze}</button><button class="btn" onclick="gBuff('opts')">🔢 ${S.buffs.opts}</button></div>`);
  const gi=$('#gi');
  gi.onkeydown=e=>{if(e.key==='Enter')gSubmit()};
  if(M.sticky)gi.oninput=e=>{if(e.inputType==='insertText'&&Math.random()<.15)gi.value+=gi.value.slice(-1)};
  if(M.bats){let b='';for(let i=0;i<4;i++)b+=`<span class="bat" style="top:${5+rnd(80)}%;animation-delay:-${rnd(30)/10}s;animation-duration:${2+rnd(30)/10}s">🦇</span>`;$('#ar').insertAdjacentHTML('beforeend',b)}
  gNext();gi.focus();
  const iv=setInterval(()=>{
    if(G.frozen>0)G.frozen=Math.max(0,G.frozen-.1);else G.t-=.1;
    G.k++;if(M.fake&&G.k%10===0)G.off=rnd(17)-8;
    gDraw();if(G.t<=0)endGuess();
  },100);
  CL.push(()=>clearInterval(iv));
  if(M.swap){const sched=()=>{const h=setTimeout(()=>{if(!G.over){gNext();sched()}},4000+rnd(4000));CL.push(()=>clearTimeout(h))};sched()}
}
function gDraw(){
  const d=Math.max(0,G.t+(G.M.fake?G.off:0));
  $('#gt').textContent=(G.frozen>0?'❄ ':'')+Math.ceil(d);
  $('#tb').style.width=Math.min(100,d/G.tot*100)+'%';
}
function scr(s){if(s.length<4)return s;const m=shuffle(s.slice(1,-1).split('')).join('');return s[0]+m+s[s.length-1]}
function gNext(){
  const M=G.M,w=G.pool[G.idx++%G.pool.length];
  const rev=!!(M.rev&&Math.random()<M.rev);
  G.cur={w:w,rev:rev,ans:rev?[w.en]:w.ru};
  let txt=rev?w.ru[0]:w.en;
  if(!rev&&M.scr&&Math.random()<M.scr)txt=scr(txt);
  const el=$('#gw');el.className='gword'+(M.mirror&&Math.random()<M.mirror?' mir':'');el.style.left='';el.style.top='';
  if(M.hide&&Math.random()<M.hide){el.className+=' hid';el.style.left=rnd(65)+'%';el.style.top=(8+rnd(75))+'%'}
  el.textContent=txt;
  $('#gi').value='';$('#gopts').innerHTML='';
  if(M.opts)gOpts();
}
function gOpts(){
  const c=G.cur,correct=c.ans[0];
  const d=shuffle(WORDS.filter(w=>w!==c.w)).slice(0,3).map(w=>c.rev?w.en:w.ru[0]);
  const o=shuffle([correct,...d]);
  $('#gopts').innerHTML=`<div class="opts">${o.map((x,i)=>`<button class="btn" data-o="${i}">${x}</button>`).join('')}</div>`;
  $('#gopts').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{if(o[i]===correct)gCorrect();else{hap('bad');b.disabled=true}});
}
function gSubmit(){
  if(G.over)return;
  if(ok($('#gi').value,G.cur.ans))gCorrect();
  else{hap('bad');const a=$('#ar');a.classList.remove('badf');void a.offsetWidth;a.classList.add('badf');$('#gi').value=''}
}
function gCorrect(){
  G.score++;G.got.push(G.cur.w);addWord(G.cur.w.en,G.cur.w.ru,1);hap('ok');
  $('#gs').textContent='Счёт: '+G.score+(G.x2?' · ×2':'');
  const a=$('#ar');a.classList.add('okf');setTimeout(()=>a.classList.remove('okf'),180);
  gNext();
}
function gBuff(k){
  if(G.over)return;
  if(S.buffs[k]<1)return toast('Нет баффа — купи в магазине');
  if(G.used[k]>=CONFIG.BUFF_LIMIT)return toast('Лимит на игру: '+CONFIG.BUFF_LIMIT);
  S.buffs[k]--;G.used[k]++;save();
  const btn=document.querySelectorAll('.row .btn');
  if(k==='auto'){toast('Авто-ответ: '+G.cur.ans[0]);gCorrect()}
  if(k==='freeze'){G.frozen+=10;toast('Время заморожено на 10 сек')}
  if(k==='opts')gOpts();
  const idx={auto:2,freeze:3,opts:4}[k];
  const rowBtns=document.querySelectorAll('#screen .row')[1].querySelectorAll('.btn');
  const names={auto:'🤖',freeze:'❄️',opts:'🔢'};
  const order=['auto','freeze','opts'];
  rowBtns.forEach((b,i)=>b.textContent=names[order[i]]+' '+S.buffs[order[i]]);
}
function endGuess(){
  if(G.over)return;G.over=true;clean();
  const c=Math.round(G.score*CONFIG.COIN_PER_WORD*G.M.rw*mult()*(G.x2?2:1));
  S.coins+=c;S.best=Math.max(S.best,G.score);S.games++;save();head();
  view(`<h2>⏱ Время вышло!</h2>
  <div class="card" style="text-align:center"><div class="big">${G.score} слов</div><div style="color:var(--gold);font-weight:800;font-size:1.3em">+${c} 🪙</div>${G.x2?'<div class="muted">множитель ×2 применён</div>':''}<div class="muted">Рекорд: ${S.best}</div></div>
  ${G.got.length?`<div class="card"><b>Добавлено в библиотеку:</b><div class="muted">${G.got.map(w=>w.en+' — '+w.ru[0]).join(' · ')}</div></div>`:''}
  <div class="row"><button class="btn pri" onclick="guessIntro()">Ещё раз</button><button class="btn" onclick="menu()">Меню</button></div>`);
}

let R=null;
function reviewPick(max=8){
  const now=Date.now(),all=Object.keys(S.lib);
  const due=all.filter(e=>S.lib[e].next<=now).sort((a,b)=>S.lib[a].k-S.lib[b].k||S.lib[b].wr-S.lib[a].wr);
  let pick=due.slice(0,max);
  if(pick.length<5){pick=pick.concat(shuffle(all.filter(e=>!pick.includes(e)&&S.lib[e].k<5)).slice(0,5-pick.length))}
  return shuffle(pick);
}

/* ============ WORDLE ============ */
let WD=null,wcur='';
function wordle(){
  clean();SC='wordle';
  const today=dstr(new Date());
  if(S.wd.date!==today){S.wd={date:today,g:[],done:false,won:false};save()}
  const seed=Math.floor(new Date(today).getTime()/DAY);
  WD={ans:WL[seed%WL.length]};wcur='';wDraw();
}
function evalG(g,a){const r=Array(5).fill('b'),cnt={};for(let i=0;i<5;i++){if(g[i]===a[i])r[i]='g';else cnt[a[i]]=(cnt[a[i]]||0)+1}for(let i=0;i<5;i++){if(r[i]==='g')continue;if(cnt[g[i]]>0){r[i]='y';cnt[g[i]]--}}return r}
function wDraw(){
  const a=WD.ans[0],G2=S.wd.g,st={};
  let rows='';
  for(let r=0;r<6;r++){
    let cells='';
    if(r<G2.length){const ev=evalG(G2[r],a);for(let i=0;i<5;i++){cells+=`<div class="wt ${ev[i]}">${G2[r][i]}</div>`;const o={g:3,y:2,b:1};if(!st[G2[r][i]]||o[ev[i]]>o[st[G2[r][i]]])st[G2[r][i]]=ev[i]}}
    else for(let i=0;i<5;i++)cells+=`<div class="wt">${r===G2.length?(wcur[i]||''):''}</div>`;
    rows+=`<div class="wr">${cells}</div>`;
  }
  const kb=['qwertyuiop','asdfghjkl','zxcvbnm'].map((row,ri)=>`<div class="kr">${ri===2?'<button class="wk wide" onclick="wKey(\'Enter\')">OK</button>':''}${row.split('').map(c=>`<button class="wk ${st[c]||''}" onclick="wKey('${c}')">${c}</button>`).join('')}${ri===2?'<button class="wk wide" onclick="wKey(\'Back\')">⌫</button>':''}</div>`).join('');
  view(`${backBtn}<h2>🟩 Wordle</h2>
  <div class="muted">Угадай английское слово из 5 букв за 6 попыток. Новое слово каждый день.</div>
  <div class="wg">${rows}</div>
  ${S.wd.done?`<div class="card" style="text-align:center">${S.wd.won?'🎉 Верно!':'😕 Не угадал'} Слово: <b>${a}</b> — ${WD.ans[1]}<div class="muted">Новое слово — завтра</div></div>`:`<div class="kb">${kb}</div>`}`);
}
function wKey(k){
  if(SC!=='wordle'||S.wd.done)return;
  if(k==='Back')wcur=wcur.slice(0,-1);
  else if(k==='Enter'){
    if(wcur.length<5)return toast('Нужно 5 букв');
    S.wd.g.push(wcur);const won=wcur===WD.ans[0];wcur='';
    if(won||S.wd.g.length>=6){
      S.wd.done=true;S.wd.won=won;
      addWord(WD.ans[0],[WD.ans[1]],1);
      if(won){const c=25+(6-S.wd.g.length)*5;S.coins+=c;head();toast('+'+c+' 🪙')}
    }
    save();hap('ok');
  } else if(/^[a-z]$/.test(k)&&wcur.length<5)wcur+=k;
  wDraw();
}
document.addEventListener('keydown',e=>{
  if(SC!=='wordle'||e.ctrlKey||e.metaKey)return;
  if(e.key==='Enter')wKey('Enter');else if(e.key==='Backspace')wKey('Back');else if(/^[a-zA-Z]$/.test(e.key))wKey(e.key.toLowerCase());
});

  const t=TEXTS[rnd(TEXTS.length)];
  RD={t:t,marked:{},left:45};
  const body=t.s.split(/([A-Za-z']+)/).map(p=>/^[A-Za-z']+$/.test(p)?`<span class="tw" data-w="${p.toLowerCase().replace(/'s$/,'')}">${p}</span>`:p).join('');
  view(`${backBtn}<h2>📖 ${t.t}</h2>
  <div class="bar"><span class="muted">Читай. Незнакомые слова можно нажать — они сохранятся.</span><span class="big" id="rt">45</span></div>
  <div class="timebar"><i id="rb"></i></div>
  <div class="card read" id="rtxt">${body}</div>
  <button class="btn pri" onclick="readQ()">Готов, к вопросам</button>`);
  $('#rtxt').onclick=e=>{
    const el=e.target.closest('.tw');if(!el)return;
    const w=el.dataset.w,tr=RD.t.g[w]||(BY[w]&&BY[w].ru[0]);
    if(!tr)return toast('Для этого слова нет перевода в словаре');
    if(RD.marked[w]){delete RD.marked[w];el.classList.remove('mark')}
    else{RD.marked[w]=tr;el.classList.add('mark');toast(w+' — '+tr)}
  };
  const iv=setInterval(()=>{RD.left-=.2;$('#rt').textContent=Math.ceil(RD.left);$('#rb').style.width=(RD.left/45*100)+'%';if(RD.left<=0){clearInterval(iv);readQ()}},200);
  CL.push(()=>clearInterval(iv));
}
function readQ(){
  clean();
  Object.keys(RD.marked).forEach(w=>addWord(w,[RD.marked[w]],0));
  const nm=Object.keys(RD.marked).length;save();
  RD.qi=0;RD.ok=0;RD.nm=nm;rQ();
}
function rQ(){
  if(RD.qi>=RD.t.q.length)return rDone();
  const q=RD.t.q[RD.qi];
  view(`<h2>Вопрос ${RD.qi+1} из ${RD.t.q.length}</h2><div class="card">${q.q}</div>
  <div>${q.o.map((o,i)=>`<button class="btn" style="margin-bottom:8px" id="q${i}" onclick="rAns(${i})">${o}</button>`).join('')}</div>`);
}
function rAns(i){
  const q=RD.t.q[RD.qi];if(RD.lock)return;RD.lock=true;
  if(i===q.a){RD.ok++;hap('ok')}else hap('bad');
  $('#q'+q.a).classList.add('good');if(i!==q.a)$('#q'+i).classList.add('bad');
  setTimeout(()=>{RD.lock=false;RD.qi++;rQ()},900);
}
function rDone(){
  const c=Math.round(RD.ok*5*mult());S.coins+=c;save();head();
  view(`<h2>Готово!</h2><div class="card" style="text-align:center"><div class="big">${RD.ok} / ${RD.t.q.length}</div><div style="color:var(--gold);font-weight:800">+${c} 🪙</div><div class="muted">Новых слов в библиотеке: ${RD.nm}</div></div>
  <div class="row"><button class="btn pri" onclick="startRead()">Другой текст</button><button class="btn" onclick="menu()">Меню</button></div>`);
}

/* ============ УРОВНИ ============ */
function levels(){
  clean();SC='lv';
  view(`${backBtn}<h2>🗺 Уровни</h2>`+RAW.map((L,i)=>{
    const open=i<=S.level,next=i===S.level+1,cost=i?lvCost(i):0;
    const total=WORDS.filter(w=>w.lvl===i).length;
    const known=Object.keys(S.lib).filter(e=>BY[e]&&BY[e].lvl===i).length;
    return `<div class="card"><div class="bar"><span>${i}. ${L.t}</span><span>${open?'✅':next?'🪙 '+cost:'🔒 '+cost}</span></div>
    <div class="muted">${known} / ${total} слов${UNLOCKS[i]?' · открывает «'+UNLOCKS[i]+'»':''}</div>
    <div class="progress"><i style="width:${total?known/total*100:0}%"></i></div>
    ${next?`<button class="btn gold" onclick="lvUp(${i})">Открыть за ${cost} 🪙</button>`:''}</div>`;
  }).join(''));
}
function lvUp(i){
  const c=lvCost(i);
  if(i!==S.level+1)return;
  if(S.coins<c)return toast('Не хватает '+(c-S.coins)+' 🪙');
  S.coins-=c;S.level=i;save();head();hap('ok');
  modal(`<div style="font-size:2.4em">🎉</div><h2>Уровень ${i} открыт!</h2><div>${RAW[i].t}</div>${UNLOCKS[i]?`<div style="color:var(--gold);margin-top:8px">Новое: «${UNLOCKS[i]}»</div>`:''}`,'Круто',levels);
}

/* ============ МАГАЗИН ============ */
function shop(){
  clean();SC='shop';
  view(`${backBtn}<h2>🛒 Магазин</h2>`+SHOP.map(it=>`<div class="card"><div class="bar"><span>${it.ico} ${it.n}</span><span class="muted">в запасе: ${S.buffs[it.id]}</span></div><div class="muted">${it.d}</div><button class="btn gold" style="margin-top:8px" onclick="buy('${it.id}')">Купить за ${it.p} 🪙</button></div>`).join('')+`<div class="muted">В одной игре каждый бафф можно использовать не более ${CONFIG.BUFF_LIMIT} раз.</div>`);
}
function buy(id){
  const it=SHOP.find(x=>x.id===id);
  if(S.coins<it.p)return toast('Не хватает койнов');
  S.coins-=it.p;S.buffs[id]++;save();head();hap('ok');shop();toast('Куплено: '+it.n);
}

/* ============ БИБЛИОТЕКА ============ */
function library(){
  clean();SC='lib';
  const n=Object.keys(S.lib).length;
  view(`${backBtn}<h2>📚 Библиотека</h2>
  <div class="card"><div class="muted">Всего слов: ${n} · Выучено (●●●●●): ${learned()} из 1000</div><div class="progress"><i style="width:${Math.min(100,learned()/10)}%"></i></div></div>
  <button class="btn pri" style="margin-bottom:8px" onclick="startReview(false)">🔁 Повторить сейчас</button>
  <input type="text" id="ls" placeholder="Поиск слова..." oninput="libList()" autocomplete="off">
  <div class="card" style="margin-top:10px" id="ll"></div>`);
  libList();
}
function libList(){
  const q=norm($('#ls').value||''),ks=Object.keys(S.lib).sort((a,b)=>S.lib[b].ts-S.lib[a].ts).filter(e=>!q||e.includes(q)||norm(S.lib[e].ru.join(' ')).includes(q)).slice(0,200);
  $('#ll').innerHTML=ks.length?ks.map(e=>`<div class="wl"><div><b>${e}</b><div class="muted">${S.lib[e].ru.join(' / ')}</div></div><div class="dots">${dots(S.lib[e].k)}</div></div>`).join(''):'<div class="muted">Пока пусто. Играй — слова появятся тут.</div>';
}

/* ============ РЕЙТИНГ ============ */
function rank(){
  clean();SC='rank';
  const bots=[["Aigerim",18],["Dastan",15],["Nika",12],["Timur",10],["Sasha",7]];
  const all=[...bots,["Ты",S.best]].sort((a,b)=>b[1]-a[1]);
  view(`${backBtn}<h2>🏆 Рейтинг</h2>
  <div class="card">${all.map((p,i)=>`<div class="wl" style="${p[0]==='Ты'?'color:var(--gold);font-weight:800':''}"><span>${i+1}. ${p[0]}</span><span>${p[1]} слов</span></div>`).join('')}
  <div class="muted" style="margin-top:8px">Демо-данные. Настоящий рейтинг и дуэли требуют сервера.</div></div>
  <button class="btn pri" onclick="invite()">⚔ Вызвать друга</button>`);
}
function invite(){
  const text=`Я выучил ${learned()} слов в MyEngly и мой рекорд — ${S.best} слов за 30 сек. Побьёшь?`;
  const url='https://t.me/share/url?url='+encodeURIComponent(CONFIG.BOT_LINK)+'&text='+encodeURIComponent(text);
  if(tg&&tg.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank');
}

/* ============ НАСТРОЙКИ ============ */
function settings(){
  clean();SC='set';
  const th=[['dark','Тёмная'],['light','Светлая'],['ocean','Океан'],['sunset','Закат']];
  view(`${backBtn}<h2>⚙️ Настройки</h2>
  <div class="card"><b>Тема</b><div class="grid" style="margin-top:8px">${th.map(t=>`<button class="btn ${S.theme===t[0]?'pri':''}" onclick="setTheme('${t[0]}')">${t[1]}</button>`).join('')}</div></div>
  <div class="card"><b>Размер шрифта: <span id="fv">${S.fs}</span></b><input type="range" min="14" max="24" value="${S.fs}" oninput="setFs(this.value)"></div>
  <div class="card"><label><input type="checkbox" ${S.vib?'checked':''} onchange="S.vib=this.checked;save()"> Вибрация (в Telegram)</label></div>
  <button class="btn bad" onclick="resetAll()">Сбросить прогресс</button>`);
}
function setTheme(t){S.theme=t;save();applyTheme();settings()}
function setFs(v){S.fs=+v;save();applyTheme();$('#fv').textContent=v}
function resetAll(){if(confirm('Удалить весь прогресс?')){S=def();save();applyTheme();init()}}

/* ============ СТАРТ ============ */
function init(){
  applyTheme();
  $('#foot').innerHTML=`By developer ${CONFIG.DEV}<br>Sponsored by ${CONFIG.SPONSORS}`;
  S.factIdx++;save();head();
  if(!S.tested)test();else enter(false);
}
init();
</script>
</body>
</html>
